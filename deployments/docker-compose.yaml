name: fbtracker
services:
  app:
    build:
      context: ..
      dockerfile: src/dockerfile
    init: true
    shm_size: 1gb
    ports:
      - "127.0.0.1:9000:8080"
    volumes:
      - observations:/app/data
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Tracker__Notifications__DryRun: ${TRACKER_DRY_RUN:-true}
      Tracker__Notifications__Token: ${TELEGRAM_TOKEN:-}
      Tracker__Notifications__ChatId: ${TELEGRAM_CHAT_ID:-}
      Tracker__Notifications__RedisConnection: redis:6379
    depends_on:
      redis:
        condition: service_healthy
  redis:
    image: redis:8.2-alpine
    command: ["redis-server", "--appendonly", "yes"]
    restart: unless-stopped
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
volumes:
  observations:
  redis:
