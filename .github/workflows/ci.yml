name: FC 27 checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r src/Transport/requirements.txt
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: dotnet restore fbtracker.sln
      - run: dotnet test fbtracker.sln --no-restore -c Release --logger trx
      - run: dotnet publish src/fbtracker.csproj --no-restore -c Release -o artifacts/app
